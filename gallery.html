<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Gallery · Trueso · Kanhaiya Lal Saraf Jewellers</title>
  <meta name="description" content="Take a visual tour of Trueso's showrooms in Varanasi. Browse photos of our Godowlia and Sigra store interiors, jewellery displays, and craftsmanship.">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

  <!-- Bootstrap 5 JavaScript Bundle (Required for Dropdowns & Carousels) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
  <!-- GSAP & ScrollTrigger Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js" defer></script>
  <!-- Main Application Script -->
  <script src="js/app.js" defer></script>
</head>
<body>

  <!-- Preloader Placeholder -->
  <div id="preloader-placeholder"></div>

  <!-- Header Placeholder -->
  <header id="header-placeholder"></header>

  <!-- LED Gold Rate Ticker Placeholder -->
  <div id="ticker-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <!-- Breadcrumbs -->
      <nav aria-label="breadcrumb" class="mb-5">
        <ol class="breadcrumb ledger-text">
          <li class="breadcrumb-item"><a href="index.html" class="text-muted text-decoration-none" data-i18n="nav.home">Home</a></li>
          <li class="breadcrumb-item active text-oxblood" aria-current="page" data-i18n="nav.gallery">Gallery</li>
        </ol>
      </nav>

      <!-- Page Header -->
      <div class="text-center mb-5">
        <span class="eyebrow" data-i18n="galleryPage.kicker">Take A Tour</span>
        <h1 class="mb-3" data-i18n="galleryPage.title">Store Images</h1>
        <p class="Lora text-muted lead max-width-800 mx-auto" style="font-size: 1.15rem;" data-i18n="galleryPage.desc">
          A closer look inside our Varanasi showrooms — where century-old craftsmanship meets a modern, hallmarked shopping experience.
        </p>
      </div>

      <!-- Gallery Grid -->
      <div class="row g-4" id="gallery-grid">
        <div class="col-6 col-lg-3">
          <a href="images/gallery-store-1.jpg" class="gallery-thumb-link" data-bs-toggle="modal" data-bs-target="#galleryLightbox" data-img="images/gallery-store-1.jpg">
            <img src="images/gallery-store-1.jpg" alt="Trueso showroom interior — display counters" class="gallery-thumb">
          </a>
        </div>
        <div class="col-6 col-lg-3">
          <a href="images/gallery-store-2.jpg" class="gallery-thumb-link" data-bs-toggle="modal" data-bs-target="#galleryLightbox" data-img="images/gallery-store-2.jpg">
            <img src="images/gallery-store-2.jpg" alt="Trueso showroom interior — seating and display counters" class="gallery-thumb">
          </a>
        </div>
        <div class="col-6 col-lg-3">
          <a href="images/gallery-store-3.jpg" class="gallery-thumb-link" data-bs-toggle="modal" data-bs-target="#galleryLightbox" data-img="images/gallery-store-3.jpg">
            <img src="images/gallery-store-3.jpg" alt="Trueso showroom — jewellery display wall" class="gallery-thumb">
          </a>
        </div>
        <div class="col-6 col-lg-3">
          <a href="images/gallery-store-4.jpg" class="gallery-thumb-link" data-bs-toggle="modal" data-bs-target="#galleryLightbox" data-img="images/gallery-store-4.jpg">
            <img src="images/gallery-store-4.jpg" alt="Trueso silver display shelves" class="gallery-thumb">
          </a>
        </div>
        <div class="col-6 col-lg-3">
          <a href="images/gallery-store-5.jpg" class="gallery-thumb-link" data-bs-toggle="modal" data-bs-target="#galleryLightbox" data-img="images/gallery-store-5.jpg">
            <img src="images/gallery-store-5.jpg" alt="Kanhaiya Lal Saraf Godowlia showroom" class="gallery-thumb">
          </a>
        </div>
        <div class="col-6 col-lg-3">
          <a href="images/gallery-store-6.jpg" class="gallery-thumb-link" data-bs-toggle="modal" data-bs-target="#galleryLightbox" data-img="images/gallery-store-6.jpg">
            <img src="images/gallery-store-6.jpg" alt="KLSJ Trueso Godowlia store front" class="gallery-thumb">
          </a>
        </div>
        <div class="col-6 col-lg-3">
          <a href="images/gallery-store-7.jpg" class="gallery-thumb-link" data-bs-toggle="modal" data-bs-target="#galleryLightbox" data-img="images/gallery-store-7.jpg">
            <img src="images/gallery-store-7.jpg" alt="Trueso KLSJ Jewellers reception counter" class="gallery-thumb">
          </a>
        </div>
        <div class="col-6 col-lg-3">
          <a href="images/gallery-store-8.jpg" class="gallery-thumb-link" data-bs-toggle="modal" data-bs-target="#galleryLightbox" data-img="images/gallery-store-8.jpg">
            <img src="images/gallery-store-8.jpg" alt="Trueso Showroom Godowlia interior" class="gallery-thumb">
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- Lightbox Modal -->
  <div class="modal fade" id="galleryLightbox" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content bg-transparent border-0">
        <button type="button" class="btn-close btn-close-white ms-auto me-3 mt-3" data-bs-dismiss="modal" aria-label="Close"></button>
        <div class="modal-body text-center pt-0">
          <img src="" id="galleryLightboxImg" class="img-fluid rounded" alt="Store image preview">
        </div>
      </div>
    </div>
  </div>

  <style>
    .gallery-thumb-link { display: block; overflow: hidden; border-radius: 4px; border: 1px solid var(--bs-border-color, #e5e0d8); }
    .gallery-thumb { width: 100%; height: 220px; object-fit: cover; display: block; transition: transform 0.4s ease; }
    .gallery-thumb-link:hover .gallery-thumb { transform: scale(1.06); }
  </style>

  <script>
    document.getElementById('galleryLightbox').addEventListener('show.bs.modal', function (event) {
      const trigger = event.relatedTarget;
      const imgSrc = trigger.getAttribute('data-img');
      document.getElementById('galleryLightboxImg').setAttribute('src', imgSrc);
    });
  </script>

  <!-- Footer Placeholder -->
  <footer id="footer-placeholder"></footer>

</body>
</html>
